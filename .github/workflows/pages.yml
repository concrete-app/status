name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write version.json
        run: |
          printf '{"version":"%s","sha":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" \
            "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
